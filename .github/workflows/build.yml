name: Build Mobile Forge Mod
on: [push, workflow_dispatch]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Set up JDK 8
      uses: actions/setup-java@v4
      with:
        java-version: '8'
        distribution: 'temurin'

    - name: Force Generate Wrapper and Permissions
      run: |
        # This manually builds a fresh gradle environment from scratch
        gradle wrapper --gradle-version 2.7
        chmod +x gradlew

    - name: Setup Forge Environment & Build
      run: |
        ./gradlew setupDecompWorkspace --no-daemon
        ./gradlew build --no-daemon

    - name: Package Mod into ZIP
      run: |
        mkdir -p deploy
        cp build/libs/*.jar deploy/ || cp *.jar deploy/ || true
        zip -r FakepixelMod_MobileRelease.zip deploy/

    - name: Upload Finished ZIP Artifact
      uses: actions/upload-artifact@v4
      with:
        name: FakepixelMod_ZIP
        path: FakepixelMod_MobileRelease.zip
