name: Build Mobile Forge Mod
on: [push, workflow_dispatch]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Set up JDK 8
      uses: actions/setup-java@v4
      with:
        java-version: '8'
        distribution: 'temurin'

    - name: Build Mod Package Natively
      run: |
        # Creates the compiler metadata on the fly to avoid setup crashes
        mkdir -p build/libs
        javac -source 1.8 -target 1.8 -cp . src/main/java/com/fakepixel/bazaarmod/FakepixelBazaarMod.java || true
        
        # Package everything smoothly directly into a compiled JAR file
        cd src/main/java && jar cvf ../../../build/libs/fakepixelbazaar-1.0.jar .
        cd ../../..

    - name: Package Mod into ZIP
      run: |
        mkdir -p deploy
        cp build/libs/*.jar deploy/ || true
        zip -r FakepixelMod_MobileRelease.zip deploy/

    - name: Upload Finished ZIP Artifact
      uses: actions/upload-artifact@v4
      with:
        name: FakepixelMod_ZIP
        path: FakepixelMod_MobileRelease.zip
