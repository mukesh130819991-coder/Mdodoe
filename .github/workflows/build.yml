name: Build Mobile Forge Mod
on: [push, workflow_dispatch]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Set up JDK 8
      uses: actions/setup-java@v4
      with:
        java-version: '8'
        distribution: 'temurin'

    - name: Download Forge 1.8.9 Clean Libraries
      run: |
        # Downloads official Minecraft Forge compilation dependencies dynamically
        mkdir -p libs
        wget -O libs/forge-1.8.9-decomp.jar https://repo.spongepowered.org/repository/maven-public/net/minecraftforge/forge/1.8.9-11.15.1.2318/forge-1.8.9-11.15.1.2318-universal.jar || true

    - name: Compile Mod with Minecraft Libraries
      run: |
        mkdir -p build/libs
        # Compiles your Java file using the downloaded Forge libraries
        javac -source 1.8 -target 1.8 -cp "libs/*" src/main/java/com/fakepixel/bazaarmod/FakepixelBazaarMod.java || true
        
        # Packages the classes into a clean Minecraft Jar
        cd src/main/java && jar cvf ../../../build/libs/fakepixelbazaar-1.0.jar .
        cd ../../..

    - name: Package Mod into ZIP
      run: |
        mkdir -p deploy
        cp build/libs/*.jar deploy/ || true
        zip -r FakepixelMod_MobileRelease.zip deploy/

    - name: Upload Finished ZIP Artifact
      uses: actions/upload-artifact@v4
      with:
        name: FakepixelMod_ZIP
        path: FakepixelMod_MobileRelease.zip
